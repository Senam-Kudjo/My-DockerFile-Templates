server {
    listen 80;

    # Include MIME types for correct file serving
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Error pages
    error_page 400 401 402 403 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 500 501 502 503 504 505 506 507 508 510 511 /error-page.html;

    # Enable sendfile for performance
    sendfile on;

    # Gzip settings for compression
    gzip on;
    gzip_comp_level 9;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_disable "MSIE [1-6]\.";
    gzip_proxied no-cache no-store private expired auth;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/rss+xml
        application/x-javascript
        application/xml
        image/svg+xml
        font/eot
        font/otf
        font/ttf
        text/css
        text/javascript
        text/js
        text/plain
        text/xml;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Content-hashed static assets: fail loudly (404) if missing instead of
    # silently falling back to index.html, and cache aggressively since a
    # content change always produces a new, unique filename.
    location ~* \.(?:js|mjs|css|json|map|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # index.html and SPA client-side routes (e.g. /dashboard, /my-shifts/3):
    # never cache the shell so a redeploy is always picked up on next load.
    #
    # HTTP-003A: CSP on the document response only (not the immutable-asset block
    # above) -- CSP governs the document that loads it, not the assets themselves.
    # img-src allows data: because the bundled styles (assets/css/app.css, pulled
    # in via styles.scss) ship Bootstrap's own data:image/svg+xml background-image
    # icons for form-check/form-select/navbar-toggler/accordion/close controls.
    #
    # HTTP-003B: ENFORCED policy, backed by e2e/csp-compliance.csp.ts (production
    # build served with this exact header, zero violations across every routed
    # screen). It differs from the strict Report-Only policy below in exactly two
    # evidenced places:
    #   - style-src 'unsafe-inline': Angular injects component styles as <style>
    #     elements at runtime, @ngxpert/hot-toast and sweetalert2 do the same, and
    #     component templates carry static style="" attributes. Script execution
    #     stays locked to 'self' (no inline/eval script is permitted).
    #   - font-src data:: the vendored theme CSS embeds an icon font as data: URI.
    # The strict policy stays Report-Only so remaining style work stays visible.
    location / {
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; form-action 'self'" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Optional: Serve custom error page
    location = /error-page.html {
        internal;
    }
}
